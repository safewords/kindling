# kindling's service settings: how this server is hosted, and nothing else.
#
# Copy to kindling.toml (or point KINDLING_CONFIG at a file elsewhere). Every
# key has a default that works on a laptop; on a real network set
# [server] ip and [api] token. A variable set in the process environment
# (PXE_SERVER_IP, PXE_API_TOKEN, …) wins over this file.
#
# The boot policy — rules, profiles, the default profile, boot loaders — is NOT
# configured here, and a [profiles] or [[rule]] table in this file stops the
# server. It lives in the database: the web UI's Policy screen, the API, or
#   pxe pxe:rule add …   pxe pxe:profile set …   pxe pxe:policy default …

[server]
# The address that goes into every DHCP reply and every generated URL. Detected
# from the routing table when unset — a guess on a machine with several
# interfaces. In production, with DHCP on, it must be stated.
#ip = "10.0.0.2"
# Built from ip and [http] port unless set. Behind a reverse proxy or TLS, say
# it here.
#http_base = "http://boot.example.internal"
# What the PXE menu line says on a client's screen.
#description = "kindling netboot"

[http]
#host = "0.0.0.0"
#port = 8080

[dhcp]
# Proxy DHCP: answers the boot half of the conversation beside whatever
# already does DHCP, and hands out no addresses. Off if something else serves
# boot options.
#enabled = true
#bind = "0.0.0.0"
# Port 4011, the PXE boot server port. Some firmware insists on it.
#boot_server_port = true

[tftp]
#enabled = true
#bind = "0.0.0.0"
#port = 69
# Served over TFTP, and over HTTP under /boot/: loaders, kernels, images.
# autoexec.ipxe is generated by the server and need not be here.
#root = "tftproot"
# 1468 is a 1500-byte frame less its headers. Above it every packet fragments.
#max_block_size = 1468
# RFC 7440 windowing.
#max_window_size = 16

[smb]
# A read-only SMB share for Windows Setup booted over the network: wimboot
# starts Setup over HTTP, but Setup installs only from a disk or a share. Off
# unless enabled. SMB 2/3, NTLMv2, every session signed; no guest, because
# WinPE refuses guest logons. An empty password keeps it from starting.
#enabled = false
#bind = "0.0.0.0"
#port = 445
#user = "install"
#password = ""
# name=dir, comma-separated, each directory under [tftp] root.
#shares = "win11=images/windows11/media"

[loop_detection]
# The backstop for iPXE that announces itself neither by option 77 nor 175.
# Counted in whole DHCP transactions; below 2 turns it off.
#threshold = 4
#window_secs = 90

[api]
# Guards everything that changes what a machine boots. Unset means those
# endpoints are CLOSED. `openssl rand -hex 32`. Or set PXE_API_TOKEN.
#token = ""

[database]
# SQLite on disk by default. Or a url for Postgres or MySQL.
#path = "storage/pxe.sqlite"
#url = "postgres://pxe:secret@db.internal/pxe"
# How long the boot log is kept. The only thing here that grows.
#event_retention_days = 30

[inventory]
# An IEEE oui.txt, or a prefix,vendor[,class] CSV, beyond the built-in table.
#oui_file = "oui.txt"

[app]
# local | testing | staging | production. Unset means production.
#env = "production"
# The framework's encryption key: `base64:` and 32 random bytes. Or APP_KEY.
#key = ""

[log]
# auto | json | pretty. `auto` is JSON in production and readable elsewhere.
#format = "auto"
# A tracing filter, as RUST_LOG takes.
#filter = "info,sqlx=warn"
